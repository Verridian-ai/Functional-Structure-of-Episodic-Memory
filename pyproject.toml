# Verridian AI - Project Configuration
# =====================================
# Modern Python project configuration using pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verridian-ai"
version = "1.0.0"
description = "Brain-inspired Legal Intelligence System for Australian Family Law"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Daniel Fleuren", email = "daniel@verridian.ai"}
]
keywords = [
    "legal-ai",
    "episodic-memory",
    "active-inference",
    "vector-symbolic-architecture",
    "family-law",
    "australia"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.0.0,<3.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "google-generativeai>=0.3.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "jsonlines>=3.1.0,<4.0.0",
    "polars>=0.19.0,<1.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "neo4j>=5.0.0,<6.0.0",
    "langfuse>=2.0.0,<3.0.0",
    "cognee>=0.1.0,<1.0.0",
    "mem0ai>=0.0.20,<1.0.0",
    "requests>=2.28.0,<3.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "tqdm>=4.65.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "mypy>=1.5.0,<2.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.1.0,<1.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.urls]
"Homepage" = "https://github.com/Verridian-ai/Functional-Structure-of-Episodic-Memory"
"Documentation" = "https://verridian.ai/docs"
"Bug Tracker" = "https://github.com/Verridian-ai/Functional-Structure-of-Episodic-Memory/issues"

[project.scripts]
verridian-pipeline = "scripts.run_full_pipeline:main"
verridian-validate = "scripts.validate_system:main"

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*", "docs*"]

# -----------------------------------------------------------------------------
# Black - Code Formatting
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | ui
    | data
    | __pycache__
)/
'''

# -----------------------------------------------------------------------------
# Ruff - Fast Python Linter
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument (common in callbacks/handlers)
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ files
"tests/*" = ["ARG"]       # unused arguments in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]

# -----------------------------------------------------------------------------
# MyPy - Static Type Checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Gradually enable
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Exclude directories
exclude = [
    "ui/",
    "data/",
    "law docs research/",
    "tests/",
    "scripts/",
    "build/",
    "dist/",
    ".venv/",
]

# Per-module overrides for third-party libraries
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "sentence_transformers.*",
    "langfuse.*",
    "neo4j.*",
    "cognee.*",
    "mem0ai.*",
    "google.generativeai.*",
    "openai.*",
    "polars.*",
    "jsonlines.*",
    "httpx.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest - Testing Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-v",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_api: marks tests that require external API access",
]
asyncio_mode = "auto"

# -----------------------------------------------------------------------------
# Coverage - Code Coverage Configuration
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/_archive/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 60
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
